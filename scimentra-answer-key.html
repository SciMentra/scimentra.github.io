        font-weight: 700 !important;
        break-after: avoid;
      }

      body.cbse-paper-preview
      .question-text .cbse-centred-or * {
        font-weight: 700 !important;
      }

      body.cbse-paper-preview .cbse-general-instructions {
        margin: 12px 0 16px;
        line-height: 1.4;
      }

      body.cbse-paper-preview .cbse-instructions-title {
        font-weight: 700 !important;
        margin-bottom: 5px;
      }

      body.cbse-paper-preview .cbse-general-instructions ol {
        margin: 0;
        padding-left: 24px;
      }

      body.cbse-paper-preview .cbse-general-instructions li {
        margin: 3px 0;
      }

      body.cbse-paper-preview .cbse-ar-directions {
        margin: 10px 0;
        line-height: 1.4;
        break-after: avoid;
      }

      body.cbse-paper-preview .cbse-ar-title {
        font-weight: 700 !important;
        margin-bottom: 4px;
      }
    `;

    document.head.appendChild(style);
  }

  page.querySelectorAll('.cbse-general-instructions').forEach(
    element => element.remove()
  );

  const subjects = exam.subjects || [];
  const sections = subjects.flatMap(
    subject => subject.sections || []
  );

  const questionCount = sections.reduce(
    (sum, section) => sum + (section.questions || []).length,
    0
  );

  const summaries = [];

  for (const subject of subjects) {
    const subjectGroups = new Map();

        for (const section of subject.sections || []) {
      const name = cbsePrintSectionName(subject, section, true);
      const key = name.trim().toLowerCase();

      if (!subjectGroups.has(key)) {
        subjectGroups.set(key, {
          name,
          count: 0,
          marks: new Set()
        });
      }

      const group = subjectGroups.get(key);

      for (const q of section.questions || []) {
        group.count++;
        group.marks.add(
          Number(q.marks || section.marksPerQuestion || 0)
        );
      }
    }

    for (const group of subjectGroups.values()) {
      const prefix = subjects.length > 1
        ? `${subject.subject}: `
        : '';

      let text =
        `${prefix}${group.name} contains ${group.count} questions`;

      const marks = [...group.marks];

      if (marks.length === 1 && marks[0] > 0) {
        text +=
          ` carrying ${marks[0]} ` +
          `${marks[0] === 1 ? 'mark' : 'marks'} each`;
      }

      summaries.push(text + '.');
    }
  }

  const instructions = [
    `This paper contains ${questionCount} main questions.`,
    `The paper is divided into ${summaries.length} sections.`,
    ...summaries
  ];

  const allMainQuestionsRequired = sections.every(
    section =>
      !section.type ||
      section.type === 'all' ||
      section.type === 'internal'
  );

  instructions.push(
    allMainQuestionsRequired
      ? 'All main questions are compulsory. Follow any choices specified within a question.'
      : 'Follow the number of questions to be attempted in each section.'
  );

  const hasOR = sections.some(
    section =>
      Number(section.orCount) > 0 ||
      (section.questions || []).some(q =>
        /\bOR\b/.test(String(q.text || q.question || ''))
      )
  );

  if (hasOR) {
    instructions.push(
      'Where an internal choice is marked OR, answer only one alternative.'
    );
  }

  // Include instructions entered when building this paper.
  if (exam.instructions) {
    const source = document.createElement('div');

    source.innerHTML = String(exam.instructions)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(?:p|div|li)>/gi, '\n');

    const additional = source.textContent
      .split(/\n+/)
      .map(line => line.trim())
      .filter(line =>
        line && !/^general instructions\s*:?\s*$/i.test(line)
      );

    instructions.push(...additional);
  }

  const general = document.createElement('div');
  general.className = 'cbse-general-instructions';

  const title = document.createElement('div');
  title.className = 'cbse-instructions-title';
  title.textContent = 'General Instructions:';

  const list = document.createElement('ol');

  for (const text of [...new Set(instructions)]) {
    const item = document.createElement('li');
    item.textContent = text;
    list.appendChild(item);
  }

  general.append(title, list);

  const details = page.querySelector(':scope > .details-rect');

  if (details) {
    details.after(general);
  } else {
    page.prepend(general);
  }

  const blocks = Array.from(
    page.querySelectorAll(':scope > .section-block')
  );

  let blockIndex = 0;

  for (const subject of exam.subjects || []) {
    const groups = new Map();

        const entries = (subject.sections || []).map(section => {
      const name = cbsePrintSectionName(subject, section);
      const key = name.trim().toLowerCase();

      const count =
        section.type === 'any'
          ? Number(section.attemptAny || section.numQuestions || 0)
          : section.type === 'internal'
          ? Number(section.numPairs || 0)
          : Number(
              section.numQuestions ??
              (section.questions || []).length
            );

      const total =
        section.type === 'all' && section.questions?.length
          ? section.questions.reduce(
              (sum, q) =>
                sum + Number(q.marks || section.marksPerQuestion || 0),
              0
            )
          : count * Number(section.marksPerQuestion || 0);

           if (!groups.has(key)) {
        groups.set(key, {
          name,
          total: 0,
          shown: false,
          sections: []
        });
      }

      groups.get(key).total += total;
      groups.get(key).sections.push(section);

      return { section, key };
    });

    for (const { section, key } of entries) {
      const block = blocks[blockIndex++];
      if (!block) continue;

      const group = groups.get(key);
      block.replaceChildren();

            if (!group.shown) {
        const heading = document.createElement('div');
        heading.className = 'cbse-section-heading';
        heading.textContent = group.name.toUpperCase();

        const box = document.createElement('div');
        box.className = 'cbse-section-box';

        const instruction = document.createElement('span');
        instruction.className = 'cbse-box-instruction';

        const questions = group.sections.flatMap(
          item => item.questions || []
        );

        const allRequired = group.sections.every(
          item => !item.type || item.type === 'all'
        );

        if (allRequired) {
          instruction.textContent =
            `Answer all ${questions.length} questions.`;

          const questionMarks = [
            ...new Set(
              group.sections.flatMap(item =>
                (item.questions || []).map(q =>
                  Number(q.marks || item.marksPerQuestion || 0)
                )
              )
            )
          ];

          if (questionMarks.length === 1 && questionMarks[0] > 0) {
            const mark = questionMarks[0];

            instruction.textContent +=
              ` Each question carries ${mark} ` +
              `${mark === 1 ? 'mark' : 'marks'}.`;
          }
        } else {
          instruction.textContent = [
            ...new Set(
              group.sections.map(item => {
                if (item.instructions) return item.instructions;

                if (item.type === 'any') {
                  return `Answer any ${
                    item.attemptAny || item.numQuestions
                  } questions.`;
                }

                if (item.type === 'internal') {
                  return `Answer one alternative from each of ${
                    item.numPairs
                  } pairs.`;
                }

                return `Answer all ${item.numQuestions} questions.`;
              })
            )
          ].join(' ');
        }

        const hasOR = group.sections.some(
          item =>
            Number(item.orCount) > 0 ||
            (item.questions || []).some(q =>
              /\bOR\b/.test(String(q.text || q.question || ''))
            )
        );

        if (hasOR && !/\bOR\b/.test(instruction.textContent)) {
          instruction.textContent +=
            ' Where OR is given, answer only one alternative.';
        }

        const marks = document.createElement('span');
        marks.className = 'cbse-section-total';
        marks.textContent = `${group.total} Marks`;

               box.append(instruction, marks);
        block.append(heading);
        if (!/^english\b/i.test(String(subject.subject || ''))) {
          block.append(box);
        }

        group.shown = true;
      }

      // Assertion–Reason stays within the existing section.
      const isAssertionReason = /assertion/i.test(
        [
          section.label,
          section.name,
          section.mcqType,
          ...(section.questions || []).map(q => q.type || q.mcqType)
        ].join(' ')
      );

      if (isAssertionReason) {
        const directions = document.createElement('div');
        directions.className = 'cbse-ar-directions';

        const title = document.createElement('div');
        title.className = 'cbse-ar-title';
        title.textContent = 'Assertion–Reason Questions';

        const text = document.createElement('div');
        text.textContent =
          'Read Assertion (A) and Reason (R) in each question. ' +
          'Choose the correct answer from the options given.';

        directions.append(title, text);
        block.appendChild(directions);
      }

      // Remove duplicate section headings with no remaining content.
      if (!block.children.length) {
        block.remove();
      }
    }
  }
}

      // If review already produced pair markup, trust it as-is
           if (/\bpair-a\b/.test(pre) && /\bpair-b\b/.test(pre)) {

                if (parts.length > 0) {

            if (inlineOpts && inlineOpts.length >= 2) {
              optionLines.push(...inlineOpts.map(opt => autoLatexAll(opt.trim())));
            } else {
              const singleOpt = line.match(/^\s*(?:^|\s|\()(?:(?:[A-D])|(?:iv|vi|ix|v?i{1,3}))\s*[)\.:]\s+.+$/i);

    // Typeset MathJax (FORCE normal weight: strip bold tags + bold styles, then clear & re-typeset)
const target = document.getElementById('print-preview');

if (target) {

// Inserts a gap + editable OR box when (A)... and (B)... exist in the SAME block (even with <br>)
function insertManualOrBoxes(root=document){
  (root.querySelectorAll('.question-text')||[]).forEach(qt=>{
   if (qt.querySelector('.pair-or')) return;
// do NOT return just because pairs exist; we still have to insert the OR

    // Text-first parse (robust across stray tags/BRs)
    const raw = (qt.innerHTML || '')
      .replace(/<\/p>/gi,'\n').replace(/<p[^>]*>/gi,'')
      .replace(/<br\s*\/?>/gi,'\n')
      .replace(/<div[^>]*>/gi,'\n').replace(/<\/div>/gi,'')
      .replace(/\r/g,'');
    const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);

    const A_RE = /^\(\s*A\s*\)|^A[\)\.\:]/i;
    const B_RE = /^\(\s*B\s*\)|^B[\)\.\:]/i;

    let aIdx = lines.findIndex(l=>A_RE.test(l));
    let bIdx = -1;
    if (aIdx !== -1){
      for (let i=aIdx+1;i<lines.length;i++){ if (B_RE.test(lines[i])) { bIdx=i; break; } }
    }
    if (aIdx !== -1 && bIdx !== -1){
      const aHTML = lines[aIdx].replace(A_RE,'').trim() + (bIdx-aIdx>1? ('\n'+lines.slice(aIdx+1,bIdx).join('\n')) : '');
      const bHTML = lines[bIdx].replace(B_RE,'').trim() + (bIdx<lines.length-1? ('\n'+lines.slice(bIdx+1).join('\n')) : '');
      qt.innerHTML =
        `<div class="pair-a"><span class="label">(A)</span><span class="txt">${aHTML}</span></div>`+
        `<div class="pair-or">(OR)</div><div class="ab-gap"></div>`+
        `<div class="pair-b"><span class="label">(B)</span><span class="txt">${bHTML}</span></div>`;
    }
  });
}

async function exportCurrentPreviewPdfBlob() {
  await waitForPreviewReady();

  const pages = Array.from(
    document.querySelectorAll(
      '#print-preview .a4-page.exam-paginated-page'
    )
  );

  if (!pages.length) {
    throw new Error(
      'No page-wise preview pages were found'
    );
  }

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4',
    compress: true
  });

  for (let index = 0; index < pages.length; index++) {
    const page = pages[index];

    await waitForExamImages(page);

    if (index > 0) {
      pdf.addPage('a4', 'portrait');
    }

    const canvas = await html2canvas(page, {
      scale: 2,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#ffffff',
      logging: false,
      scrollX: 0,
      scrollY: 0,
      windowWidth: page.scrollWidth,
      windowHeight: page.scrollHeight
    });

       const imageData =
      canvas.toDataURL('image/png');

    pdf.addImage(
      imageData,
      'PNG',
      0,
      0,
      210,
      297
    );
  }

  return pdf.output('blob');
}

function downloadPreviewBlob(blob, filename) {

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

if (names.length <= 1) {
  updateGap();

  if (!window.JSZip) {

    downloadPreviewBlob(zipBlob, `${examPart}_All_Schools.zip`);
  } catch (err) {

     btn.innerHTML =

  }

// This function OUTSIDE of the above
async function renderMathJaxToImages(containerSelector) {
  const container = document.querySelector(containerSelector);
  if (!container) return;

  // Wait for MathJax to finish rendering equations
  if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
    await window.MathJax.typesetPromise([container]);
  }
  // Find all MathJax elements and convert them to images
  const mathElements = container.querySelectorAll('mjx-container');
  for (const el of mathElements) {
    // Use dom-to-image to convert each equation to a PNG
    const dataUrl = await domtoimage.toPng(el, { bgcolor: '#fff' });
    // Create <img> element and replace the MathJax SVG
    const img = document.createElement('img');
    img.src = dataUrl;
    img.style.verticalAlign = 'middle';
    img.style.display = 'inline-block';
    img.style.maxHeight = '32px';
    el.parentNode.replaceChild(img, el);
  }
}

  position: fixed;
  top: 92px;
  right: 48px;
  z-index: 10002;

  width: 38px;
  height: 38px;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #ffffff;
  border: 1.5px solid #bcd6ef;
  border-radius: 50%;

  color: #185496;
  font-size: 1.65em;
  font-weight: 700;
  line-height: 1;

  box-shadow: 0 2px 10px rgba(15,61,107,0.14);
  cursor: pointer;
" title="Close" aria-label="Close settings">×</button>

<script>
  const floatingSettingsBtn =
  document.getElementById(
    'floating-settings-btn'
  );

const settingsModal =
  document.getElementById(
    'settings-popup-modal'
  );

const closeSettingsBtn =
  document.getElementById(
    'close-settings-popup'
  );

const pageSelect =
  document.getElementById('page-select');

const currentPageLabel =
  document.getElementById(
    'current-page-label'
  );

const gapSlider =
  document.getElementById('gap-slider');

const gapValue =
  document.getElementById(
    'gap-slider-value'
  );

const lineSpacingSlider =
  document.getElementById('line-spacing-slider');

const lineSpacingValue =
  document.getElementById('line-spacing-slider-value');

const marginSlider =
  document.getElementById(
    'margin-slider'
  );

const marginValue =
  document.getElementById(
    'margin-slider-value'
  );

function getVisibleExamPageIndex() {
  const pages = Array.from(
    document.querySelectorAll(
      '#print-preview .exam-paginated-page'
    )
  );

  if (!pages.length) return 0;

  const viewportCenter =
    window.innerHeight / 2;

  let bestIndex = 0;
  let bestDistance = Infinity;

  pages.forEach((page, index) => {
    const rect =
      page.getBoundingClientRect();

    const pageCenter =
      rect.top + rect.height / 2;

    const distance =
      Math.abs(pageCenter - viewportCenter);

    if (distance < bestDistance) {
      bestDistance = distance;
      bestIndex = index;
    }
  });

  return bestIndex;
}

function updateSliderUIFromPage() {
  const settings =
    ensureExamPageSettings(
      window.__examCurrentPageIndex
    );

  if (currentPageLabel) {
    currentPageLabel.textContent =
      `Page ${
        window.__examCurrentPageIndex + 1
      }`;
  }

  if (gapSlider) {
    gapSlider.value =
      String(settings.questionGap);
  }

  if (gapValue) {
    gapValue.textContent =
      `${settings.questionGap}px`;
  }

    if (lineSpacingSlider) {
    lineSpacingSlider.value =
      String(settings.lineSpacing);
  }

  if (lineSpacingValue) {
    lineSpacingValue.textContent =
      settings.lineSpacing.toFixed(2);
  }

  if (marginSlider) {
    marginSlider.value =
      String(settings.margin);
  }

  if (marginValue) {
    marginValue.textContent =
      `${Number(settings.margin).toFixed(1)}cm`;
  }

  if (pageSelect) {
    pageSelect.value =
      String(window.__examCurrentPageIndex);
  }
}

function scrollToSelectedExamPage() {
  const targetPage =
    document.querySelector(
      '.exam-paginated-page' +
      `[data-page-index="` +
      `${window.__examCurrentPageIndex}"]`
    );

  if (!targetPage) return;

  const top =
    targetPage.getBoundingClientRect().top +
    window.pageYOffset -
    90;

  window.scrollTo({
    top,
    behavior: 'smooth'
  });
}

if (floatingSettingsBtn) {
  floatingSettingsBtn.onclick = function() {
    window.__examCurrentPageIndex =
      getVisibleExamPageIndex();

    if (pageSelect) {
      pageSelect.value =
        String(
          window.__examCurrentPageIndex
        );
    }

    updateSliderUIFromPage();

    if (settingsModal) {
      settingsModal.style.display = 'flex';
    }
  };
}

if (closeSettingsBtn) {
  closeSettingsBtn.onclick = function() {
    if (settingsModal) {
      settingsModal.style.display = 'none';
    }
  };
}

if (pageSelect) {
  pageSelect.addEventListener(
    'change',
    function() {
      window.__examCurrentPageIndex =
        Math.max(
          0,
          Number(this.value) || 0
        );

      updateSliderUIFromPage();
      scrollToSelectedExamPage();
    }
  );
}

function updateGap() {
  const settings =
    ensureExamPageSettings(
      window.__examCurrentPageIndex
    );

  settings.questionGap =
    Number(gapSlider?.value || 12);

  if (gapValue) {
    gapValue.textContent =
      `${settings.questionGap}px`;
  }

  const targetPage =
    document.querySelector(
      '.exam-paginated-page' +
      `[data-page-index="` +
      `${window.__examCurrentPageIndex}"]`
    );

  if (targetPage) {
    targetPage.style.setProperty(
      '--exam-question-gap',
      `${settings.questionGap}px`
    );

    applyExamQuestionGap(
      targetPage,
      settings
    );
  }
}

function updateLineSpacing() {
  const settings = ensureExamPageSettings(
    window.__examCurrentPageIndex
  );

  const spacing = parseFloat(lineSpacingSlider?.value);

  settings.lineSpacing = Number.isFinite(spacing)
    ? Math.min(2, Math.max(1, spacing))
    : getDefaultExamPageSettings().lineSpacing;

  if (lineSpacingValue) {
    lineSpacingValue.textContent =
      settings.lineSpacing.toFixed(2);
  }

  const targetPage = document.querySelector(
    '.exam-paginated-page' +
    `[data-page-index="${window.__examCurrentPageIndex}"]`
  );

  if (targetPage) {
    targetPage.style.setProperty(
      '--exam-line-spacing',
      String(settings.lineSpacing)
    );
  }
}

function updateMargin() {
  const settings =
    ensureExamPageSettings(
      window.__examCurrentPageIndex
    );

  settings.margin =
    Number(marginSlider?.value || 1.5);

  if (marginValue) {
    marginValue.textContent =
      `${settings.margin.toFixed(1)}cm`;
  }

  const targetPage =
    document.querySelector(
      '.exam-paginated-page' +
      `[data-page-index="` +
      `${window.__examCurrentPageIndex}"]`
    );

  if (targetPage) {
    targetPage.style.setProperty(
      '--exam-page-margin',
      `${settings.margin}cm`
    );
  }
}

let examRepaginateTimer = null;

function queueExamRepagination() {
  const lockedPageIndex =
    window.__examCurrentPageIndex;

  clearTimeout(examRepaginateTimer);

  examRepaginateTimer = setTimeout(
    async () => {
      await renderPrintPreview();
      await waitForPreviewReady();

      const pageCount =
        document.querySelectorAll(
          '#print-preview ' +
          '.exam-paginated-page'
        ).length;

      window.__examCurrentPageIndex =
        Math.min(
          lockedPageIndex,
          Math.max(0, pageCount - 1)
        );

      refreshExamPagePicker(pageCount);
      updateSliderUIFromPage();
    },
    350
  );
}

gapSlider?.addEventListener(
  'input',
  () => {
    updateGap();
    queueExamRepagination();
  }
);

lineSpacingSlider?.addEventListener(
  'input',
  () => {
    updateLineSpacing();
    queueExamRepagination();
  }
);

marginSlider?.addEventListener(
  'input',
  () => {
    updateMargin();
    queueExamRepagination();
  }
);

// Set initial values after DOM loaded
window.addEventListener(
  'DOMContentLoaded',
  async () => {
    ensureSchoolState();

    const schoolBox =
      document.getElementById(
        'school-names-list'
      );

    if (schoolBox) {
      schoolBox.value =
        getSchoolNames().join('\n');
    }

    document
      .getElementById('apply-school-list-btn')
      ?.addEventListener('click', () => {
        syncSchoolNamesFromTextarea(true);
        renderPrintPreview();
        updateSchoolPreviewStatus();
      });

    document
      .getElementById('prev-school-btn')
      ?.addEventListener('click', () => {
        changeSchoolPreview(-1);
      });

    document
      .getElementById('next-school-btn')
      ?.addEventListener('click', () => {
        changeSchoolPreview(1);
      });

    document
      .getElementById('print-action-btn')
      ?.addEventListener(
        'click',
        handlePrintAction
      );

    updateSchoolPreviewStatus();

    await waitForPreviewReady();

    const pageCount =
      document.querySelectorAll(
        '#print-preview ' +
        '.exam-paginated-page'
      ).length;

    refreshExamPagePicker(pageCount);
    updateSliderUIFromPage();
  }
);
</script>
 <style id="ab-pair-style">
  #print-preview .ab-pair{display:block;margin:6px 0 2px}
  #print-preview .ab-pair .pair-a,
  #print-preview .ab-pair .pair-b{margin:2px 0}
  #print-preview .ab-pair .pair-or{text-align:center;font-weight:700;margin:2px 0}
  #print-preview .ab-pair .label{font-weight:700;margin-right:6px}
</style>

(function () {
  // Internal-choice (A/B) auto-pairing is temporarily disabled in preview.
})();
</script>
</body>
