  function __scKeyValue(question) {

  function __scKeyLeaf(question) {

    const html = rich(value);

    const type = String(
      question.mcqType ||
      question.type ||
      question.questionType ||

      question.options?.length ||
      /mcq|assertion|reason/i.test(type)

      holder.innerHTML = html;

      const text = holder.textContent.trim();

      const letters = text
        .replace(/\band\b/gi, ',')
        .split(/[,/&]+/)

          letter.trim().replace(/[().:]/g, '')

      if (
        letters.length &&

          .map(letter => letter.toUpperCase() + ')')

      question.parts,

      __scKeyLabel(

        reading,

      const label = first.textContent.trim();

      if (

      question.parts,
      question.mcqs

      question.answerKeySource === value;

          esc(number) + '.' +

  function __scKeySection(

      const number = Math.max(
        state.next,
        Number(question.number) || state.next
      );

      if (!state.cbse && question.mcqs?.length) {
        state.next = number + question.mcqs.length;

        return question.mcqs.map((part, index) =>
          __scKeyQuestion(
            { ...part, number:number + index },
            subjectName,
            section.label || ''
          )
        ).join('');
      }

      state.next = number + 1;

      return __scKeyQuestion(
        { ...question, number },
        subjectName,
        section.label || ''
      );
    }).join('');
  }

  function __scKeyPrepare(paper) {
    const source = paper?._cbseBlueprintSource;

    if (
      !source?.subjects?.some(subject =>
        Array.isArray(subject.rows)
      )

    const original = toReviewPaper(source);
    const answers = new Map();

    original.subjects.forEach(subject => {

          answers.set(Number(question.number), question);

      const holder = document.createElement('div');

      return holder.textContent
        .replace(/\s+/g, ' ')

    let next = 1;

    updated.subjects.forEach(subject => {
      (subject.sections || []).forEach(section => {
        (section.questions || []).forEach(question => {
          const number = Math.max(
            next,
            Number(question.number) || next

          const reference = answers.get(number);

            reference &&
            plain(__scKeyValue(question)) ===

                ? answerTree(question)
                : (question.answer || ''),

              explanation: composite
                ? ''
                : (question.explanation || ''),

              chapter: question.chapter || '',
              modelType: question.modelType || ''
            };
          })
        };
      })
    }));

    paper.schema = 'scimentra-review-paper-v1';
    paper.schoolName = paper.schoolName || paper.school || 'SciMentra';
    paper.paperType = paper.paperType || 'CBSE Assessment';

    delete paper.setup;

  function store(mode, action) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('scimentra-cbse-builder-v2', 1);

      request.onupgradeneeded = () => {
        request.result.createObjectStore('drafts', { keyPath: 'id' });
      };

      request.onerror = () => reject(request.error);

      request.onsuccess = () => {
        const database = request.result;
        const transaction = database.transaction('drafts', mode);
        let result;

        const operation = action(transaction.objectStore('drafts'));

        operation.onsuccess = () => {
          result = operation.result;
        };

        transaction.oncomplete = () => {
          database.close();
          resolve(result);
        };

        transaction.onerror = transaction.onabort = () => {
          database.close();
          reject(transaction.error || new Error('Saving failed.'));
        };
      };
    });
  }

  function __epStudentQuestionOnly(value) {
    const host = document.createElement('div');
    host.innerHTML = rich(value);

    const answerStart =
      /^[ \t]*(?:Answer|Ans|Explanation|Solution)\s*:/im;

    const nextQuestion =
      /^[ \t]*(?:Sub[- ]question\s+(?:\d+[A-Z]?|\([ivxlcdm]+\))(?:\s*\(\d+(?:\.\d+)?\s*Marks?\))?\s*:|Item\s+\d+\s*\(\d+(?:\.\d+)?\s*Marks?\)\s*:|\(?OR\)?[ \t]*$)/im;

    for (let pass = 0; pass < 100; pass++) {
      const walker = document.createTreeWalker(
        host,
        NodeFilter.SHOW_TEXT
      );

      const nodes = [];
      let node;

      while ((node = walker.nextNode())) {
        nodes.push(node);
      }

      let start = null;
      let startIndex = -1;

      for (let i = 0; i < nodes.length; i++) {
        const match = nodes[i].textContent.match(answerStart);

        if (match) {
          start = {
            node: nodes[i],
            offset: match.index
          };
          startIndex = i;
          break;
        }
      }

      if (!start) break;

      let end = null;

      for (let i = startIndex; i < nodes.length; i++) {
        const offset = i === startIndex
          ? start.offset + 1
          : 0;

        const match = nodes[i].textContent
          .slice(offset)
          .match(nextQuestion);

        if (match) {
          end = {
            node: nodes[i],
            offset: offset + match.index
          };
          break;
        }
      }

      const range = document.createRange();
      range.setStart(start.node, start.offset);

      if (end) {
        range.setEnd(end.node, end.offset);
      } else {
        range.setEnd(host, host.childNodes.length);
      }

      range.deleteContents();
    }

    [...host.querySelectorAll('p,div,span,b,strong')]
      .reverse()
      .forEach(element => {
        if (
          !element.textContent.trim() &&
          !element.querySelector(
            'img,table,svg,math,mjx-container'
          )
        ) {
          element.remove();
        }
      });

    return host.innerHTML;
  }

 <script>
  function formatSubQuestions(text) {
  if (!text) return '';

 let t = String(text)
  .replace(/\r/g, '')
  .replace(/&nbsp;/gi, ' ')
  .replace(/<br\s*\/?>/gi, '\n')
  .replace(/<\/p>/gi, '\n')
  .replace(/<p[^>]*>/gi, '')          // ← remove opening <p> so (A)/(B) are detected
  .replace(/<div[^>]*>/gi, '\n')
  .replace(/<\/div>/gi, '')
  .replace(/<li[^>]*>/gi, '\n')
  .replace(/<\/li>/gi, '')
  .replace(/<ol[^>]*>|<ul[^>]*>|<\/ol>|<\/ul>/gi, '')
  .trim();


    const lines = t.split('\n').map(s=>s.trim()).filter(Boolean);
  const A_RE = /^\s*(?:<[^>]+>\s*)*(?:\(\s*A\s*\)|A[\)\.\:])\s*/i;
  const B_RE = /^\s*(?:<[^>]+>\s*)*(?:\(\s*B\s*\)|B[\)\.\:])\s*/i;
// (kept same tokens; leaving here to confirm you’re matching A) / (A) / A. / A: even if wrapped)


  let aIdx=-1, bIdx=-1;
  for (let i=0;i<lines.length;i++){
    if (aIdx===-1 && A_RE.test(lines[i])) aIdx=i;
    if (aIdx!==-1 && bIdx===-1 && B_RE.test(lines[i])) { bIdx=i; break; }
  }

   if (aIdx!==-1 && bIdx!==-1 && bIdx>aIdx){

    const stripLead = s => s.replace(A_RE,'').replace(B_RE,'').trim();
    const dropWrappedAB = s => s.replace(/\n\s*(?:\(\s*[AB]\s*\)|[AB][\)\.\:])\s+/gi, '\n');

    const aTxt = dropWrappedAB([lines[aIdx].replace(A_RE,''), ...lines.slice(aIdx+1,bIdx)].join('\n'));
    const bTxt = dropWrappedAB([lines[bIdx].replace(B_RE,''), ...lines.slice(bIdx+1)].join('\n'));

       return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${aTxt}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${bTxt}</span></div>
    `;
  }

  // Fallback: (A)…(B)… present inside a single line/block
  const abMatch = /\bOR\b/i.test(t) ? null : t.match(/\(\s*A\s*\)\s*([\s\S]*?)\s*\(\s*B\s*\)\s*([\s\S]*)$/i);
if (abMatch) {
  const aTxt = abMatch[1].trim();
  const bTxt = abMatch[2].trim();
    return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${aTxt}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${bTxt}</span></div>
    `;
  }

  // 🔁 Fallback: A and B inside a single block (no newlines detected)
  const inline = /\bOR\b/i.test(t) ? null : t.match(/\(\s*A\s*\)\s*([\s\S]*?)\s*\(\s*B\s*\)\s*([\s\S]*)$/i);
if (inline){
    const aTxt = inline[1].trim();
    const bTxt = inline[2].trim();
    return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${aTxt}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${bTxt}</span></div>
    `;
  }

   // Default: wrap each remaining line
  return lines.map(line => `<div>${line}</div>`).join('');
} // <-- end of formatSubQuestions

// --- helper: force "(OR)" between (A) and (B) ---
function forceOrAB(html){
  if (!html) return '';
  // already has (OR) or explicit node
  if (/\(\s*OR\s*\)/i.test(html) || /\bclass\s*=\s*["']pair-or["']/.test(html)) return html;

  // pair markup present but missing (OR)
  if (/\bpair-a\b/.test(html) && /\bpair-b\b/.test(html)) {
    return html.replace(
      /(<\/div>\s*)(<div[^>]*class=["']pair-b\b)/i,
      '$1<div class="pair-or">(OR)</div><div class="ab-gap"></div>$2'
    );
  }

  // raw (A) ... (B) in one block
  const m = html.match(/\(\s*A\s*\)\s*([\s\S]*?)\s*\(\s*B\s*\)\s*([\s\S]*)$/i);
  if (m) {
    const a = m[1].trim(), b = m[2].trim();
    return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${a}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${b}</span></div>
    `;
  }
  return html;
}

// shim so older calls keep working
function ensureOrAB(html){
  return forceOrAB(html);

  function autoLatexAll(str) {
  if (!str) return '';

  // normalize legacy markers used by older content
  str = str.replace(/\$begin\{pmatrix\}/g, '\\begin{pmatrix}')
           .replace(/\$end\{pmatrix\}/g, '\\end{pmatrix}')
           .replace(/\$pmatrix\$/g, '')
           .replace(/Send/g, '');

  // If author already delimited math, just normalize $...$ → \( ... \)
  if (/\$[^$]+\$|\\\([^]*?\\\)|\\\[[\s\S]*?\\\]/.test(str)) {
    return str.replace(/\$([^\$]+)\$/g, '\\($1\\)');
  }

  // Only auto-wrap SHORT symbolic fragments, never full sentences
  const words = str.trim().split(/\s+/).length;
  const hasMathTokens = /(\^|_|\\frac|\\sqrt|\\binom|\\sum|\\int|\\lim|\\log|\\sin|\\cos|\\tan|[≤≥≈≠∞√])/.test(str);
  const isDimension = /\[[^\]]+\]/.test(str); // e.g. [M^0 L^2 T^-2]
  const looksAlgebra = /\b[A-Za-z]\s*\^\s*\d\b|[A-Za-z]\d/.test(str) || /\b[xyz]\s*=/.test(str);

  if ((isDimension || hasMathTokens || looksAlgebra) && words <= 6) {
    return `\\(${str}\\)`;
  }
  return str;
}

function __epGetQuestionType(q = {}) {
  return String(q.mcqType || q.questionType || q.type || '').trim().toLowerCase();
}

function __epIsParagraphBasedQuestion(q = {}) {
  const type = __epGetQuestionType(q);
  const rawText = String(q.question || q.text || q.body || q.html || '');

  return (
    type === 'paragraph-based mcq (single correct)' ||
    type === 'comprehensive' ||
    type.includes('paragraph') ||
    type.includes('comprehension') ||
    (Array.isArray(q.mcqs) && q.mcqs.length > 0 && String(q.passage || '').trim()) ||
    (
      /read\s+the\s+following\s+passage/i.test(rawText) &&
      /\bpassage\s*:/i.test(rawText)
    )
  );
}

function __epIsMatchingListQuestion(q = {}) {
  const type = __epGetQuestionType(q);

  const rawText = String(
    q.question ||
    q.text ||
    q.body ||
    q.html ||
    q.renderedHTML ||
    q.finalHTML ||
    q.formattedHTML ||
    ''
  );

  return (
    (type.includes('matching') && type.includes('list')) ||
    (
      /List\s*[-–—]?\s*I\b/i.test(rawText) &&
      /List\s*[-–—]?\s*II\b/i.test(rawText)
    )
  );
}


function __epIsMatchingMatrixQuestion(q = {}) {
  const type = __epGetQuestionType(q);

  const rawText = String(
    q.question ||
    q.text ||
    q.body ||
    q.html ||
    q.renderedHTML ||
    q.finalHTML ||
    q.formattedHTML ||
    ''
  );

  if (__epIsMatchingListQuestion(q)) {
    return false;
  }

  return (
    (type.includes('matching') && type.includes('matrix')) ||
    (/Column\s*I/i.test(rawText) && /Column\s*II/i.test(rawText))
  );
}

function __epParseOptionRegion(regionText = '') {
  const text = String(regionText || '').replace(/\s+/g, ' ').trim();
  if (!text) return [];

  const optionRegex = /(?:^|\s)([A-D])[\)\.:]\s*/gi;
  const matches = Array.from(text.matchAll(optionRegex));

  if (!matches.length) return [];

  const options = [];

  matches.forEach((match, index) => {
    const start = match.index + match[0].length;
    const end = index + 1 < matches.length ? matches[index + 1].index : text.length;

    options.push(
      text.slice(start, end)
        .replace(/\s+/g, ' ')
        .trim()
    );
  });

  return options.slice(0, 4);
}

function __epParseParagraphQuestionFromText(q = {}) {
  const raw = __epGetPlainQuestionText(q)
    .replace(/\r/g, '')
    .replace(/\s*\bAns(?:wer)?\s*:\s*[\s\S]*$/i, '')
    .trim();

  if (!raw) {
    return {
      passage: String(q.passage || '').trim(),
      mcqs: Array.isArray(q.mcqs) ? q.mcqs : []
    };
  }

  let cleaned = raw
    .replace(/Read\s+the\s+following\s+passage\s+and\s+answer\s+the\s+questions\s*:?\s*/i, '')
    .trim();

  const passageMatch = cleaned.match(/\bPassage\s*:\s*/i);
  let afterPassage = cleaned;

  if (passageMatch) {
    afterPassage = cleaned.slice(passageMatch.index + passageMatch[0].length).trim();
  }

  const subRegex = /\(\s*(\d+)\s*\)\s*/g;
  const subMatches = Array.from(afterPassage.matchAll(subRegex));

  if (!subMatches.length) {
    return {
      passage: String(q.passage || afterPassage || '').trim(),
      mcqs: Array.isArray(q.mcqs) ? q.mcqs : []
    };
  }

  const firstSubStart = subMatches[0].index;
  const passage = afterPassage.slice(0, firstSubStart).trim();

  const subArea = afterPassage.slice(firstSubStart).trim();
  const subMarkers = Array.from(subArea.matchAll(subRegex));

  const mcqs = subMarkers.map((marker, index) => {
    const qStart = marker.index + marker[0].length;
    const nextQStart = index + 1 < subMarkers.length ? subMarkers[index + 1].index : subArea.length;
    const block = subArea.slice(qStart, nextQStart).trim();

   const firstOption = block.search(/\bA[\)\.:]\s+/i);

    let questionText = block;
    let options = [];

    if (firstOption !== -1) {
      questionText = block.slice(0, firstOption).trim();
      options = __epParseOptionRegion(block.slice(firstOption));
    }

    return {
      question: questionText,
      text: questionText,
      body: questionText,
      options,
      answer: '',
      parsedAnswer: '',
      explanation: ''
    };
  });

  const emptyOptionCount = mcqs.filter(mcq => !Array.isArray(mcq.options) || mcq.options.length !== 4).length;

  if (emptyOptionCount > 0) {
    const firstOptionInAll = subArea.search(/\bA[\)\.:]\s+/i);

    if (firstOptionInAll !== -1) {
      const optionsText = subArea.slice(firstOptionInAll);
      const allOptions = [];

      const optionRegex = /([A-D])[\)\.:\-]\s*/gi;
      const matches = Array.from(optionsText.matchAll(optionRegex));

      matches.forEach((match, index) => {
        const start = match.index + match[0].length;
        const end = index + 1 < matches.length ? matches[index + 1].index : optionsText.length;

        allOptions.push(
          optionsText.slice(start, end)
            .replace(/\s+/g, ' ')
            .trim()
        );
      });

      if (allOptions.length >= mcqs.length * 4) {
        mcqs.forEach((mcq, index) => {
          mcq.options = allOptions.slice(index * 4, index * 4 + 4);
        });

        const questionOnlyPart = subArea.slice(0, firstOptionInAll).trim();
        const questionMarkers = Array.from(questionOnlyPart.matchAll(subRegex));

        if (questionMarkers.length === mcqs.length) {
          questionMarkers.forEach((marker, index) => {
            const qStart = marker.index + marker[0].length;
            const nextQStart = index + 1 < questionMarkers.length ? questionMarkers[index + 1].index : questionOnlyPart.length;
            const cleanQ = questionOnlyPart.slice(qStart, nextQStart).trim();

            if (cleanQ) {
              mcqs[index].question = cleanQ;
              mcqs[index].text = cleanQ;
              mcqs[index].body = cleanQ;
            }
          });
        }
      }
    }
  }

  return {
    passage,
    mcqs
  };
}

function __epNormalizeParagraphQuestion(q = {}) {
  const existingMcqs = Array.isArray(q.mcqs) ? q.mcqs : [];
  const existingPassage = String(q.passage || '').trim();

  if (existingPassage && existingMcqs.length) {
    return q;
  }

  const parsed = __epParseParagraphQuestionFromText(q);

  return {
    ...q,
    passage: existingPassage || parsed.passage || '',
    mcqs: existingMcqs.length ? existingMcqs : parsed.mcqs,
    type: 'Paragraph-Based MCQ (Single Correct)',
    mcqType: 'Paragraph-Based MCQ (Single Correct)'
  };
}

function __epGetParagraphMcqs(q = {}) {
  const normalized = __epNormalizeParagraphQuestion(q);
  return Array.isArray(normalized.mcqs) ? normalized.mcqs : [];
}

function __epGetParagraphSubQuestionText(mcq = {}) {
  return String(
    mcq.question ||
    mcq.text ||
    String(mcq.body || '').split('\n')[0] ||
    ''
  ).trim();
}

function __epCleanOption(option) {
  return String(option || '')
    // Remove only real option labels like A), A., A:
    // Do NOT remove A- because Matching Matrix answers use A-P, B-Q, C-R, D-S
    .replace(/^[A-D][).:]\s*/i, '')
    .trim();
}

function __epSafeText(value) {
  return autoLatexAll(escapeHtml(String(value || '')))
    .replace(/\r/g, '')
    .replace(/\n/g, '<br>');
}

function __epBuildOptionLines(options = []) {
  return (Array.isArray(options) ? options.slice(0, 4) : []).map((option, index) =>
    `${String.fromCharCode(65 + index)}) ${__epCleanOption(option)}`
  );
}

function __epGetPlainQuestionText(q = {}) {
  return String(q.question || q.text || q.body || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p\s*>/gi, '\n')
    .replace(/<p[^>]*>/gi, '')
    .replace(/<\/div\s*>/gi, '\n')
    .replace(/<div[^>]*>/gi, '')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/\r/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function __epParseMatchingList(q = {}) {

  const cleaned =
    __epGetPlainQuestionText(q)
      .replace(
        /\s*\bOptions\s*:?\s*[\s\S]*$/i,
        ''
      )
      .replace(/\n{3,}/g, '\n\n')
      .trim();


  const normalized =
    cleaned
      .replace(
        /\bList\s*[-–—]?\s*I\b/gi,
        ' '
      )
      .replace(
        /\bList\s*[-–—]?\s*II\b/gi,
        ' '
      )
      .replace(/\s+/g, ' ')
      .trim();


  const firstRowMatch =
    normalized.match(
      /\bP[\)\.:\-]\s*/i
    );


  let intro = '';
  let listText = normalized;


  if (
    firstRowMatch &&
    typeof firstRowMatch.index === 'number'
  ) {

    intro =
      normalized
        .slice(
          0,
          firstRowMatch.index
        )
        .trim();


    listText =
      normalized
        .slice(
          firstRowMatch.index
        )
        .trim();
  }


  /*
    JEE Advanced Matching List:

    List-I  = P Q R S
    List-II = 1 2 3 4 5
  */

  const leftLabels =
    ['P', 'Q', 'R', 'S'];

  const rightLabels =
    ['1', '2', '3', '4'];

  const rows = [];


  for (let i = 0; i < 4; i++) {

    const left =
      leftLabels[i];

    const right =
      rightLabels[i];

    const nextLeft =
      leftLabels[i + 1];


    const endLookahead =
      nextLeft
        ? `(?=\\s+${nextLeft}[\\)\\.\\:\\-]\\s*)`
        : `(?=\\s+5[\\)\\.\\:\\-]\\s*|$)`;


    const pattern =
      new RegExp(
        `${left}[\\)\\.\\:\\-]\\s*([\\s\\S]*?)\\s+${right}[\\)\\.\\:\\-]\\s*([\\s\\S]*?)${endLookahead}`,
        'i'
      );


    const match =
      listText.match(pattern);


    if (match) {

      rows.push({

        leftLabel:
          left,

        leftText:
          match[1]
            .replace(/\s+/g, ' ')
            .trim(),

        rightLabel:
          right,

        rightText:
          match[2]
            .replace(/\s+/g, ' ')
            .trim()
      });
    }
  }


  /*
    Fallback for unusual line wrapping.
  */

  if (!rows.length) {

    const fallbackPattern =
      /([P-S])[\)\.:\-]\s*([\s\S]*?)\s+([1-4])[\)\.:\-]\s*([\s\S]*?)(?=\s+[P-S][\)\.:\-]|\s+5[\)\.:\-]|$)/gi;


    let match;


    while (
      (
        match =
          fallbackPattern.exec(
            listText
          )
      ) !== null
    ) {

      rows.push({

        leftLabel:
          match[1].toUpperCase(),

        leftText:
          match[2]
            .replace(/\s+/g, ' ')
            .trim(),

        rightLabel:
          match[3],

        rightText:
          match[4]
            .replace(/\s+/g, ' ')
            .trim()
      });
    }
  }


  /*
    Extra fifth entry in List-II.
  */

  let extraRightText = '';


  const extraMatch =
    listText.match(
      /\s+5[\)\.:\-]\s*([\s\S]*?)$/i
    );


  if (extraMatch) {

    extraRightText =
      extraMatch[1]
        .replace(/\s+/g, ' ')
        .trim();
  }


  return {
    intro,
    rows,
    extraRightLabel: '5',
    extraRightText,
    raw: cleaned
  };
}


function __epRenderMatchingListBody(q = {}) {

  const parsed =
    __epParseMatchingList(q);


  if (
    parsed.rows.length !== 4 ||
    !parsed.extraRightText
  ) {

    return `

  return `

          `).join('')
        }


        <tr>

          <td></td>

          <td>
            <div class="matching-matrix-cell">

                5)
              </span>

                )}

  `;
}


function __epParseMatchingMatrix(q = {}) {
  const cleaned = __epGetPlainQuestionText(q)
    .replace(/\s*\bOptions\s*:?\s*[\s\S]*$/i, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  const lines = cleaned
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);

  const headingIndex = lines.findIndex(line =>
    /Column\s*I/i.test(line) && /Column\s*II/i.test(line)
  );

  const introLines = headingIndex > 0
    ? lines.slice(0, headingIndex)
    : [];

    let matrixLines = headingIndex >= 0
    ? lines.slice(headingIndex + 1)
    : lines.slice();

  // Fix: sometimes preview receives "Column I Column II A) ... P) ..." in one single line
  if (headingIndex >= 0) {
    const headingLine = lines[headingIndex] || '';
    const afterHeading = headingLine
      .replace(/^\s*Column\s*I\s+Column\s*II\s*/i, '')
      .trim();

    if (afterHeading && /[A-D][\)\.:\-]\s*/i.test(afterHeading)) {
      matrixLines.unshift(afterHeading);
    }
  }

  const rowPattern =
    /^\s*([A-D])[\)\.:\-]\s*(.*?)\s{2,}([P-S])[\)\.:\-]\s*(.*?)\s*$/i;

  const rowPatternLoose =
    /^\s*([A-D])[\)\.:\-]\s*(.*?)\s+([P-S])[\)\.:\-]\s*(.*?)\s*$/i;

  let rows = matrixLines
    .map(line => {
      const match = line.match(rowPattern) || line.match(rowPatternLoose);

      return match
        ? {
            leftLabel: match[1].toUpperCase(),
            leftText: match[2].trim(),
            rightLabel: match[3].toUpperCase(),
            rightText: match[4].trim()
          }
        : null;
    })
    .filter(Boolean);

  if (!rows.length) {
    const oneLine = matrixLines
      .join(' ')
      .replace(/Column\s*I\s+Column\s*II/gi, '')
      .replace(/\s+/g, ' ')
      .trim();

    const foundRows = Array.from(
      oneLine.matchAll(
        /([A-D])[\)\.:\-]\s*([\s\S]*?)\s+([P-S])[\)\.:\-]\s*([\s\S]*?)(?=\s+[A-D][\)\.:\-]\s+|$)/gi
      )
    );

    rows = foundRows.map(match => ({
      leftLabel: match[1].toUpperCase(),
      leftText: match[2].trim(),
      rightLabel: match[3].toUpperCase(),
      rightText: match[4].trim()
    }));
  }

  return {
    intro: introLines.join('\n').trim(),
    rows,
    raw: cleaned
  };
}

function __epRenderMatchingMatrixBody(q = {}) {
  const parsed = __epParseMatchingMatrix(q);

  if (!parsed.rows.length) {

  return `

            )}">

/*
  Split a long paragraph passage into smaller page-flow pieces.

  IMPORTANT:
  This does NOT split the MCQ questions/options.
  It only allows the reading passage itself to continue
  naturally onto the next A4 page instead of moving
  the entire passage to the next page.
*/
function __epSplitPassageForPageFlow(
  passage = '',
  maxChars = 280
) {
  const text = String(passage || '')
    .replace(/\r/g, '')
    .trim();

  if (!text) {
    return [''];
  }

  const paragraphs = text
    .split(/\n+/)
    .map(part => part.trim())
    .filter(Boolean);

  const chunks = [];

  function splitVeryLongSentence(sentence) {
    const words = String(sentence || '')
      .trim()
      .split(/\s+/)
      .filter(Boolean);

    let current = '';

    words.forEach(word => {
      const candidate =
        current
          ? `${current} ${word}`
          : word;

      if (
        current &&
        candidate.length > maxChars
      ) {
        chunks.push(current);
        current = word;
      } else {
        current = candidate;
      }
    });

    if (current) {
      chunks.push(current);
    }
  }

  paragraphs.forEach(paragraph => {
    /*
      Prefer splitting at sentence endings so the page
      break does not normally occur in the middle of
      a sentence.
    */
    const sentences =
      paragraph.match(
        /[^.!?]+(?:[.!?]+["'’”)\]]*|$)/g
      ) || [paragraph];

    let current = '';

    sentences.forEach(sentence => {
      const cleanSentence =
        String(sentence || '').trim();

      if (!cleanSentence) {
        return;
      }

      /*
        Extremely long sentence:
        split safely at word boundaries.
      */
      if (cleanSentence.length > maxChars) {
        if (current) {
          chunks.push(current);
          current = '';
        }

        splitVeryLongSentence(
          cleanSentence
        );

        return;
      }

      const candidate =
        current
          ? `${current} ${cleanSentence}`
          : cleanSentence;

      if (
        current &&
        candidate.length > maxChars
      ) {
        chunks.push(current);
        current = cleanSentence;
      } else {
        current = candidate;
      }
    });

    if (current) {
      chunks.push(current);
    }
  });

  return chunks.length
    ? chunks
    : [text];
}


function __epBuildParagraphPreviewQuestionHtml(
  q = {},
  currentQNum = ''
) {
  const normalized =
    __epNormalizeParagraphQuestion(q);

  const mcqs =
    __epGetParagraphMcqs(normalized);

  const startNo =
    Number(currentQNum) || 1;

  const totalSubQuestions =
    Math.max(mcqs.length, 1);

  const endNo =
    startNo + totalSubQuestions - 1;

  const rangeLabel =
    totalSubQuestions > 1
      ? `(${startNo}-${endNo})`
      : `(${startNo})`;

  /*
    NEW:
    Passage is divided into smaller independent
    page-flow pieces.

    Therefore the paginator can use the remaining
    space on the current page.
  */
  const passageChunks =
    __epSplitPassageForPageFlow(
      normalized.passage || ''
    );

  const firstPassageChunk =
    passageChunks[0] || '';

  const continuationChunks =
    passageChunks.slice(1);

  const firstPieceBottomMargin =
    continuationChunks.length
      ? '0'
      : '8px';

  /*
    First passage piece contains:
    - question number/range
    - instruction
    - beginning of passage
  */
  const firstPassageHTML = `
    <div
      class="
        paragraph-passage-piece
        exam-flow-piece
      "
      data-exam-flow-piece="paragraph-passage-first"
      style="
        margin-bottom:${firstPieceBottomMargin};
      ">

      <div class="paragraph-passage-row">

        <div
          class="question-number"
          style="min-width:70px;">
          ${rangeLabel}
        </div>

        <div class="question-body">

          <div style="
            color:#163A63;
            font-weight:400;
            line-height:1.3;
            margin-bottom:7px;
          ">
            Read the following passage and answer the questions:
          </div>

          <div
            class="paragraph-passage-text"
            style="margin-bottom:0;">
            ${__epSafeText(
              firstPassageChunk
            )}
          </div>

        </div>
      </div>
    </div>
  `;

  /*
    Remaining passage pieces.

    These are direct page-flow pieces, so if one does
    not fit, only that continuation moves to the next
    page — not the complete passage.
  */
  const continuationHTML =
    continuationChunks
      .map((chunk, index) => {
        const isLast =
          index ===
          continuationChunks.length - 1;

        return `
          <div
            class="
              paragraph-passage-continuation-piece
              exam-flow-piece
            "
            data-exam-flow-piece="paragraph-passage-continuation"
            style="
              display:block;
              margin-left:74px;
              width:calc(100% - 74px);
              max-width:calc(100% - 74px);
              box-sizing:border-box;

function waitForPreviewUserOnce(timeoutMs = 2500) {
  return new Promise(resolve => {
    if (!previewAuth) {
      resolve(null);
      return;
    }

    if (previewAuth.currentUser) {
      resolve(previewAuth.currentUser);
      return;
    }

    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      try { unsub(); } catch (e) {}
      resolve(previewAuth.currentUser || null);
    }, timeoutMs);

    const unsub = previewAuth.onAuthStateChanged(user => {
      if (done) return;
      if (user) {
        done = true;
        clearTimeout(timer);
        try { unsub(); } catch (e) {}
        resolve(user);
      }
    }, () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { unsub(); } catch (e) {}
      resolve(null);
    });
  });
}

async function ensurePreviewSignedIn() {
  if (!previewAuth) {
    throw new Error('Firebase Auth script not loaded');
  }

  const user = previewAuth.currentUser || await waitForPreviewUserOnce(2500);

  if (!user) {
    throw new Error('Admin login required to generate QR');
  }

  return user;
}

function buildPublicAnswerKeyUrl(paperId) {
  const url = new URL(window.location.origin + window.location.pathname);
  url.search = '';
  url.hash = '';
  url.searchParams.set('mode', 'answerkey');
  url.searchParams.set('paperId', paperId);

}

async function ensureAnswerKeyPaperId(examData) {
  const user = await ensurePreviewSignedIn();

  if (!user) {
    throw new Error('Anonymous sign-in failed');
  }

  const schoolNames = Array.isArray(examData.schoolNames) && examData.schoolNames.length
    ? examData.schoolNames
    : [examData.schoolName || 'SciMentra'];

  let idx = parseInt(examData.currentSchoolIndex, 10);
  if (isNaN(idx)) idx = 0;
  idx = Math.max(0, Math.min(idx, schoolNames.length - 1));

  const currentSchoolName = schoolNames[idx] || examData.schoolName || 'SciMentra';
  const schoolKey = sanitizeFileName(currentSchoolName);

  if (!examData.answerKeyPaperIds || typeof examData.answerKeyPaperIds !== 'object') {
    examData.answerKeyPaperIds = {};
  }

  const existingId = examData.answerKeyPaperIds[schoolKey];
  const docRef = existingId
    ? previewDb.collection('publicAnswerKeys').doc(existingId)
    : previewDb.collection('publicAnswerKeys').doc();

  examData.currentSchoolIndex = idx;
  examData.schoolName = currentSchoolName;
  examData.answerKeyPaperIds[schoolKey] = docRef.id;
  examData.answerKeyPaperId = docRef.id;

  sessionStorage.setItem('finalExamData', JSON.stringify(examData));

  await docRef.set({
    ...buildAnswerKeyDoc(examData),
    ownerUid: user.uid
  }, { merge: true });

  return docRef.id;
}

function cleanAnswerKeyBlock(str) {
  return String(str || '')
    .replace(/\r/g, '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p>/gi, '\n')
    .replace(/<p[^>]*>/gi, '')
    .replace(/<div[^>]*>/gi, '\n')
    .replace(/<\/div>/gi, '')
    .replace(/<li[^>]*>/gi, '\n')
    .replace(/<\/li>/gi, '')
    .replace(/<ol[^>]*>|<ul[^>]*>|<\/ol>|<\/ul>/gi, '')
    .trim();
}

function getAnswerKeySectionInstruction(section) {
  if (section.instructions) return section.instructions;

  if (section.type === 'all') {
    return `Answer all ${section.numQuestions || 0} questions`;
  }
  if (section.type === 'any') {
    return `Answer any ${section.attemptAny || section.numQuestions || 0} questions`;
  }
  if (section.type === 'internal') {
    return `Answer all ${section.numPairs || 0} pairs`;
  }
  return '';
}

function getAnswerKeySectionMarks(section) {
  if (section.type === 'all') {
    return `${section.numQuestions || 0} x ${section.marksPerQuestion || 0} = ${(section.numQuestions || 0) * (section.marksPerQuestion || 0)} Marks`;
  }
  if (section.type === 'any') {
    const n = section.attemptAny || section.numQuestions || 0;
    return `${n} x ${section.marksPerQuestion || 0} = ${n * (section.marksPerQuestion || 0)} Marks`;
  }
  if (section.type === 'internal') {
    return `${section.numPairs || 0} x ${section.marksPerQuestion || 0} = ${(section.numPairs || 0) * (section.marksPerQuestion || 0)} Marks`;
  }
  return '';
}

function formatAnswerKeyQuestionHtml(q) {
  let raw = q.html || q.question || q.text || '';

  if (/\bpair-a\b/.test(raw) && /\bpair-b\b/.test(raw)) {
    return forceOrAB(raw);
  }

  raw = removeMetaLines(removeMetaTags(removeMetaPrefix(String(raw))))
    .replace(/<img[^>]*>/gi, '')
    .trim();

  if (Array.isArray(q.options) && q.options.length) {
  raw = stripStoredOptionBlock(raw);
}

raw = raw
  .replace(
    /Assertion\s*\(\s*A\s*\)\s*:/i,
    'Assertion (A): '
  )
  .replace(
    /\s*Reason\s*\(\s*R\s*\)\s*:/i,
    '\nReason (R): '
  );
  raw = raw
    .replace(/<\/p>/gi, '<br>')
    .replace(/<p[^>]*>/gi, '')
    .replace(/<div[^>]*>/gi, '<br>')
    .replace(/<\/div>/gi, '')
    .replace(/\n/g, '<br>');

  return autoLatexAll(raw);

function formatAnswerKeyAnswerHtml(answer, subjectName = '') {
  const text = cleanAnswerKeyBlock(answer)
    .replace(/^(?:final\s*)?answer\s*[:.-]?\s*/i, '')
    .trim();

  if (!text) return '';

  const isMathSubject = /\b(math|maths|mathematics)\b/i.test(String(subjectName || ''));

  const lines = text
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean)
    .map(line => line.replace(/^Step\s*\d+\s*[:.-]?\s*/i, '').trim())
    .filter(Boolean);

  if (!lines.length) return '';

  const merged = lines.join(' ').replace(/\s+/g, ' ').trim();
  const numberedPoints = merged.match(/\d+[\.\)]\s*[\s\S]*?(?=(?:\s+\d+[\.\)]\s*)|$)/g);

  // Point-wise answers -> below "Answer:"
  if (numberedPoints && numberedPoints.length >= 2) {
    return `
      <div class="answer-point-list">
        ${numberedPoints.map(p => p.trim()).map(point => {
          const m = point.match(/^(\d+[\.\)])\s*(.*)$/);
          if (!m) {
            return `<div style="margin-bottom:4px;">${escapeHtml(point)}</div>`;
          }
          return `
            <div style="display:flex; align-items:flex-start; margin-bottom:4px;">
              <span style="display:inline-block; min-width:22px; font-weight:400;">${escapeHtml(m[1])}</span>
              <span style="display:block; flex:1;">${escapeHtml(m[2])}</span>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // Math stepwise answers -> below "Answer:"
  if (isMathSubject && lines.length >= 2) {
    return `
      <div class="answer-block-lines">
        ${lines.map(line => `<div style="margin-bottom:2px;">${autoLatexAll(line)}</div>`).join('')}
      </div>

 if (pointMatches && pointMatches.length >= 2) {

function formatExamTime(mins) {
  mins = parseInt(mins);
  if (isNaN(mins) || mins <= 0) return '';

  const hours = Math.floor(mins / 60);
  const remainder = mins % 60;
  let fraction = '';

  if (remainder === 15) fraction = '¼';
  else if (remainder === 30) fraction = '½';
  else if (remainder === 45) fraction = '¾';

  let result = '';
  if (hours === 0) {
    result = fraction ? `${fraction} hour` : `${mins} min`;
  } else {
    result = fraction ? `${hours}${fraction} hours` : `${hours} hour${hours > 1 ? 's' : ''}`;
  }

  return result;
}

function renderOptionsLayout(optionLines, hostNode) {

  if (optionLines.length === 4) {

/*
  Final check after MathJax has rendered.
  If MathJax makes an option wider, downgrade:
  4 columns → 2 columns → 1 column.
*/
function repairOptionLayouts(root = document) {
  const scope = root || document;

  scope.querySelectorAll('.option-layout').forEach(layout => {

    const items = Array.from(
      layout.querySelectorAll(':scope > .option-item')
    );

    if (items.length !== 4) return;

    const parent =
      layout.closest('.options-block') ||
      layout.parentElement;

    if (!parent) return;

    const parentStyle = window.getComputedStyle(parent);

    const paddingLeft =
      parseFloat(parentStyle.paddingLeft) || 0;

    const paddingRight =
      parseFloat(parentStyle.paddingRight) || 0;

    const availableWidth =
      parent.getBoundingClientRect().width -
      paddingLeft -
      paddingRight;

    if (availableWidth <= 0) return;


    /*
      Measure actual rendered width of each option.
    */
    function naturalWidth(item) {

      const probe = item.cloneNode(true);

      probe.style.position = 'fixed';
      probe.style.left = '-100000px';
      probe.style.top = '0';
      probe.style.visibility = 'hidden';

      probe.style.display = 'inline-block';
      probe.style.width = 'max-content';
      probe.style.minWidth = '0';
      probe.style.maxWidth = 'none';

      probe.style.whiteSpace = 'nowrap';
      probe.style.margin = '0';
      probe.style.padding = '0';
      probe.style.border = '0';

      parent.appendChild(probe);

      const width = Math.ceil(
        probe.getBoundingClientRect().width
      );

      probe.remove();

      return width;
    }


    const widths = items.map(naturalWidth);


    function changeMode(mode) {
      layout.classList.remove(
        'option-layout-4',
        'option-layout-2',
        'option-layout-1'
      );

      layout.classList.add(
        `option-layout-${mode}`
      );

      layout.setAttribute(
        'data-option-layout',
        String(mode)
      );
    }


    /*
      1. TRY FOUR OPTIONS IN ONE ROW
    */

    const gap4 = 34;

    const widthForFour =
      widths[0] +
      widths[1] +
      widths[2] +
      widths[3] +
      (gap4 * 3);

    if (widthForFour <= availableWidth - 4) {
      changeMode(4);
      return;
    }


    /*
      2. TRY TWO OPTIONS PER ROW

      A     B
      C     D
    */

    const gap2 = 52;

    const leftColumnWidth =
      Math.max(widths[0], widths[2]);

    const rightColumnWidth =
      Math.max(widths[1], widths[3]);

    const widthForTwo =
      leftColumnWidth +
      rightColumnWidth +
      gap2;

    if (widthForTwo <= availableWidth - 4) {
      changeMode(2);
      return;
    }


    /*
      3. OTHERWISE FOUR SEPARATE ROWS
    */

    changeMode(1);
  });
}

function formatQuestionText(text) {
    text = text.replace(/^\d+\.\s*/, '');
    text = text.replace(/^.*?,\s*\d+\s+Marks?\s*/i, '');
    text = text.replace(/^Q\d+:[^A-Za-z]*?Marks?\s*/i, '');
    text = text.replace(/^Q\d+:[^A-Za-z0-9]*\s*/, '');
    text = text.replace(/\s*Ans:\s*[A-D]\)?\.?$/, '');

    if (text.includes('A)') && text.includes('B)')) {
        return text
            .replace(/\s*A\)/g, '\nA)')
            .replace(/\s*B\)/g, '\nB)')
            .replace(/\s*C\)/g, '\nC)')
            .replace(/\s*D\)/g, '\nD)');
    }

    return text;
}

function stripStoredOptionBlock(raw) {
  const text = String(raw || '');

  /*
    Detect only a real option such as:
    A) option text

    Do not detect:
    Assertion (A):
  */
  const optionMatch = text.match(
    /(?:^|<br\s*\/?>|\r?\n|\s)A\)\s+(?=\S)/i
  );

  if (!optionMatch) {
    return text.trim();
  }

  return text
    .slice(0, optionMatch.index)
    .trim();
}

function stripLeadingLabel(s) {
  let t = String(s).trim();

  // Remove only real option labels: A), A., A:, (A), i), ii), etc.
  // Do NOT treat A-P, B-Q, C-R, D-S as option labels.
  const labelRe = /^\s*[\(\[]?\s*(?:[A-Da-d]|(?:iv|vi|ix|v?i{1,3}))\s*[)\.:]\s*/i;

  while (labelRe.test(t)) t = t.replace(labelRe, '');
  return t;
}

}
  function stripABPrefix(html) {
  if (html == null) return '';
  let s = String(html)
    .replace(/&nbsp;/gi, ' ')
    .replace(/^\s+(?=<)/, ''); // drop spaces before a leading tag

  // Allow any number of leading tags before the label: <b>(A)</b>, <span>A)</span>, etc.
  const RE = /^\s*(?:<[^>]+>\s*)*(?:\(\s*[AB]\s*\)|[AB][)\.:])\s*/i;

  // Strip repeatedly in case there are nested/duplicated prefixes
  while (RE.test(s)) s = s.replace(RE, '');
  return s.trim();
}

function waitForExamMathJax(maxWaitMs = 5000) {
  return new Promise(resolve => {
    const startedAt = Date.now();

    function check() {
      if (
        window.MathJax &&
        typeof window.MathJax.typesetPromise === 'function'
      ) {
        const startupPromise =
          window.MathJax.startup &&
          window.MathJax.startup.promise
            ? window.MathJax.startup.promise
            : Promise.resolve();

        Promise.resolve(startupPromise)
          .catch(() => {})
          .then(resolve);

        return;
      }

      if (Date.now() - startedAt >= maxWaitMs) {
        resolve();
        return;
      }

      setTimeout(check, 50);
    }

    check();
  });
}

function __cbseSplitLongQuestion(node) {
  if (
    typeof cbsePrintEnabled !== 'function' ||
    !cbsePrintEnabled() ||
    !node?.matches('.question-container')
  ) return null;

  const body = node.querySelector(':scope > .question-body');
  const number = node.querySelector(':scope > .question-number');
  const line = body?.querySelector(':scope > .cbse-question-line');
  const stem = line?.querySelector(':scope > .question-text');

  if (!body || !number || !line || !stem) return null;

  // Keep the existing MCQ option handling.
  if (
    options?.textContent.trim() ||
    options?.querySelector('img, mjx-container')
  ) {

  }

  function hasContent(element) {
    return !!(
      element.textContent.trim() ||
      element.querySelector(
        'img, svg, math, mjx-container, table'

  // Split at paragraphs and existing line breaks.
  // Keep formulas, tables, images and lists intact.
  function splitMarkup(element) {
    const result = [];
    let part = element.cloneNode(false);
    part.removeAttribute('id');

      if (hasContent(part)) result.push(part);

      part.removeAttribute('id');

       for (const child of element.childNodes) {

      // Allow long (A)/(B) alternatives to flow across pages

        child.nodeType === 1 &&
        child.matches('.cbse-hanging-choice')
      ) {
        const label = child.querySelector(
          ':scope > .cbse-hanging-label'
        );

        const content = child.querySelector(
          ':scope > .cbse-hanging-content'
        );

        const isPoetry =
          /\b(?:poetry|poem|verse|stanza)\b/i.test(
            stem.textContent.slice(0, 180)
          );

        if (label && content && !isPoetry) {
          const fragments = splitMarkup(content);

          if (fragments.length > 1) {
            flush();

            fragments.forEach((fragment, index) => {
              const choice = child.cloneNode(false);
              const newLabel = label.cloneNode(true);
              const newContent = content.cloneNode(false);

              // Display (A)/(B) only once.
              // Preserve its text-column indentation.

                newLabel,

          }

      }

      // Keep complete marked subquestions together.
      if (
        child.nodeType === 1 &&
        child.matches(
          '.cbse-subquestion-row, .cbse-hanging-choice'

      ) {

        part.appendChild(
          child.cloneNode(true)

        flush();

      }

      // allowing it to move independently during pagination.

        child.nodeType === 1 &&
        child.tagName === 'TABLE'

          child.cloneNode(true)

        child.tagName === 'BR'

        child.nodeType === 1 &&

          '.cbse-centred-or, .cbse-subquestion-row'

  const chunks = splitMarkup(stem);

  if (chunks.length < 2) return null;

  const groups = [];
  let pending = [];

  for (const chunk of chunks) {
    pending.push(chunk);

    const text = chunk.textContent.trim();

        // Keep instructions with the first subquestion.
    const hasSubquestion = !!chunk.querySelector(
      '.cbse-subquestion-row'
    );

        const isInstruction =
      !!chunk.querySelector('.exam-print-instruction') ||
      /^(?:[^:\n]{1,80}:\s*)?(?:attempt|answer)\s+(?:any|all|the\s+following)\b/i.test(text);

      !hasSubquestion &&

    if (groups.length) {
      groups[groups.length - 1].push(...pending);
    } else {
      groups.push(pending);
    }
  }

  if (groups.length < 2) return null;

  const pieces = groups.map((group, index) => {
    const piece = node.cloneNode(false);

    piece.removeAttribute('id');
    piece.classList.add('exam-flow-piece');

    piece.setAttribute(
      'data-exam-flow-piece',
      'cbse-question-part'
    );

    piece.setAttribute('data-cbse-flow', 'true');

    const numberCopy = number.cloneNode(true);
    const bodyCopy = body.cloneNode(false);
    const lineCopy = line.cloneNode(false);
    const stemCopy = stem.cloneNode(false);

    // Show the question number only at the beginning.
    if (index > 0) {
      numberCopy.textContent = '';
      numberCopy.setAttribute('aria-hidden', 'true');
    }

    for (const chunk of group) {
      for (const paragraph of chunk.querySelectorAll('p')) {

    for (const child of line.children) {

    piece.append(numberCopy, bodyCopy);

  });

  const lastBody = last.querySelector(
    ':scope > .question-body'
  );

  for (const child of body.childNodes) {

    }
  }

  last.setAttribute('data-cbse-flow-last', 'true');

  node.remove();

  return pieces;
}

function __examSplitStandardQuestion(node) {

  if (cbsePieces) return cbsePieces;
  if (
    !node ||
    !node.matches('.question-container')
  ) {
    return [node];
  }

  /*
    Paragraph and Matching Matrix have already been
    separated by their own render functions.
  */
  if (
    node.querySelector('.matching-matrix-table') ||
    node.closest('.paragraph-set-preview') ||
    node.closest('.matching-set-preview')
  ) {
    return [node];
  }

  const numberNode =
    node.querySelector(
      ':scope > .question-number'
    );

  const bodyNode =
    node.querySelector(
      ':scope > .question-body'
    );

  if (!numberNode || !bodyNode) {
    return [node];
  }

  const optionsNode =
    bodyNode.querySelector(
      ':scope > .options-block'
    );

  if (!optionsNode) {
    return [node];
  }

  /*
    Build a question-only block.
  */
  const questionPart =
    document.createElement('div');

  questionPart.className =
    'question-container ' +
    'normal-question-flow ' +
    'exam-flow-piece';

  questionPart.setAttribute(
    'data-exam-flow-piece',
    'normal-question'
  );

  const newBody =
    document.createElement('div');

  newBody.className = 'question-body';

  Array.from(bodyNode.childNodes)
    .forEach(child => {
      if (child !== optionsNode) {
        newBody.appendChild(child);
      }
    });

  questionPart.appendChild(numberNode);
  questionPart.appendChild(newBody);

  /*
    Options become a separate block.
  */
  optionsNode.remove();

  optionsNode.classList.add(
    'normal-options-flow',
    'exam-flow-piece'
  );

  optionsNode.setAttribute(
    'data-exam-flow-piece',
    'normal-options'
  );

  node.remove();

  return [
    questionPart,
    optionsNode
  ];
}

function __examExpandTopLevelNode(node) {
  if (!node || node.nodeType !== 1) {
    return [];
  }

  if (
    node.matches(
      '.paragraph-set-preview, ' +
      '.matching-set-preview'
    )
  ) {
    return __examExtractDirectFlowPieces(
      node
    );
  }

  if (
    node.matches('.question-container')
  ) {
    return __examSplitStandardQuestion(
      node
    );
  }

  return [node];
}

function __examCanFollowHeading(node) {
  return !!(
    node &&
    node.nodeType === 1 &&
    (
      node.hasAttribute(
        'data-exam-flow-piece'

      node.matches(
        '.question-container, ' +
        '.paragraph-set-preview, ' +
        '.matching-set-preview'

function getExamFlowBlocks(sourcePage) {
  const rawNodes = Array.from(
    sourcePage.children
  ).filter(node => {
    return (
      node.nodeType === 1 &&
      !node.classList.contains(
        'print-footer-spacer'
      ) &&
      !node.classList.contains(
        'exam-page-footer'
      )
    );
  });

  /*
    Convert paragraph sets, matching matrices and
    ordinary MCQs into smaller independent blocks.
  */
  const nodes = [];

  rawNodes.forEach(node => {
    __examExpandTopLevelNode(node)
      .forEach(piece => {
        if (piece) {
          nodes.push(piece);
        }
      });
  });

  const blocks = [];
  let index = 0;

  while (index < nodes.length) {
    const node = nodes[index];

    /*
      Keep school heading and details box together.
    */
    if (
      node.classList.contains(
        'heading-row'
      ) &&
      nodes[index + 1] &&
      nodes[index + 1].classList.contains(
        'details-rect'
      )
    ) {
      const group =
        createExamFlowGroup();

      group.classList.add(
        'exam-first-page-header'
      );

      group.appendChild(node);
      group.appendChild(
        nodes[index + 1]
      );

      blocks.push(group);
      index += 2;
      continue;
    }

    /*
      Subject heading + section heading +
      only the first logical content block.
    */
    if (isExamSubjectHeading(node)) {
      const group =
        createExamFlowGroup();

      group.appendChild(node);
      index += 1;

      if (
        nodes[index] &&
        nodes[index].classList.contains(
          'section-block'
        )
      ) {
        group.appendChild(nodes[index]);
        index += 1;
      }

      if (
        nodes[index] &&
        __examCanFollowHeading(
          nodes[index]
        )
      ) {
        group.appendChild(nodes[index]);
        index += 1;
      }

      blocks.push(group);
      continue;
    }

    /*
      Section heading stays only with the first
      passage/question/matrix piece—not the whole set.
    */
    if (
      node.classList.contains(
        'section-block'
      )
    ) {
      const group =
        createExamFlowGroup();

      group.appendChild(node);
      index += 1;

      if (
        nodes[index] &&
        __examCanFollowHeading(
          nodes[index]
        )
      ) {
        group.appendChild(nodes[index]);
        index += 1;
      }

      blocks.push(group);
      continue;
    }

    /*
      All passage questions, options, matrix rows
      and normal MCQ options now flow independently.
    */
    blocks.push(node);
    index += 1;
  }

  return blocks;
}

function applyExamQuestionGap(
  root,
  settings = getDefaultExamPageSettings()
) {
  if (!root) return;

  const gap =
    `${Number(settings.questionGap || 12)}px`;

  const questionBlocks = [];

  if (
    root.nodeType === 1 &&
    root.matches(
      '.question-container, .paragraph-set-preview'
    )
  ) {
    questionBlocks.push(root);
  }

  root.querySelectorAll(
    '.question-container, .paragraph-set-preview'
  ).forEach(node => {
    questionBlocks.push(node);
  });

    questionBlocks.forEach(node => {
    const isContinuation =
      node.hasAttribute('data-cbse-flow') &&
      !node.hasAttribute('data-cbse-flow-last');

    node.style.setProperty(
      'margin-bottom',
      isContinuation ? '2px' : gap,
      'important'
    );
  });
}

});

window.__examCurrentPageIndex = Math.min(

);

refreshExamPagePicker(totalPages);

function formatMarksForPrint(value) {
  const n = Number(value);

  if (Math.abs(n - 0.5) < 0.000001) {
    return '\\(\\frac{1}{2}\\)';
  }

  return Number.isInteger(n)
    ? String(n)
    : String(n);
}

function formatSectionTotal(value) {
  const n = Number(value);

  return Number.isInteger(n)
    ? String(n)
    : String(n);
}

function formatExamTextForPrint(root) {
  if (!root) return;

  // Convert embedded MCQ lists into the automatic option layout.
  root.querySelectorAll('.question-text ol').forEach(list => {
    const items = Array.from(list.children).filter(
      item => item.tagName === 'LI'
    );

    if (items.length !== 4) return;

    const labels = items.map(item =>
      (item.textContent.trim().match(/^\(?([A-D])[).:]\s+/i) || [])[1]
    ).join('').toUpperCase();

    if (
      String(list.getAttribute('type') || '').toUpperCase() !== 'A' &&
      labels !== 'ABCD'
    ) return;

    const lines = items.map((item, index) => {
      const option = item.cloneNode(true);

      if (labels === 'ABCD') {
        const walker = document.createTreeWalker(
          option,
          NodeFilter.SHOW_TEXT
        );

        let first = walker.nextNode();

        while (first && !first.textContent.trim()) {
          first = walker.nextNode();
        }

        if (first) {
          first.textContent = first.textContent.replace(
            /^\s*(?:\([A-D]\)|[A-D][).:])\s*/i,
            ''
          );
        }
      }

      option.querySelectorAll('p,div').forEach(element => {
        element.replaceWith(
          ...element.childNodes,
          document.createTextNode(' ')
        );
      });

      option.querySelectorAll('br').forEach(element => {
        element.replaceWith(document.createTextNode(' '));
      });

      return String.fromCharCode(65 + index) + ') ' +
        option.innerHTML.replace(/\r?\n/g, ' ').trim();
    });

    const options = document.createElement('div');
    options.className = 'options-block';

    options.setAttribute(
      'data-options',
      encodeURIComponent(JSON.stringify(lines))
    );

    options.innerHTML = renderOptionsLayout(lines, options);
    list.replaceWith(options);
  });

  // Identify instruction lines.
  const instructionStart = /^(?:(?:\(\d+\)|\([a-z]\)|[ivxlcdm]+\.)\s*)?(?:(?:read|study|observe|examine)\s+(?:the\s+)?(?:(?:following|given)\s+)?(?:(?:prose(?:\s*(?:\/|and|&)\s*drama)?|drama|poetry|poetic)\s+)?(?:passages?|extracts?|poems?|texts?|tables?|charts?|graphs?|data|pictures?|images?|information|cases?)\b|(?:answer|attempt)\s+(?:any|all|both|each|(?:the\s+)?(?:foll(?:o)?wing|questions?))\b|choose\s+(?:the\s+)?(?:correct|appropriate|best)\b|(?:complete|rewrite|match)\s+(?:the\s+)?following\b|fill\s+(?:in\s+)?(?:the\s+)?blanks?\b|write\s+(?:a|an)\s+(?:formal|informal|letter|paragraph|report|notice|email)\b)/i;

  root.querySelectorAll(
    '.question-text, .question-text p, .question-text div, ' +
    '.paragraph-passage-text, .paragraph-sub-text'
  ).forEach(block => {
    if (
      block.closest(
        '.options-block, .option-layout, .exam-print-instruction'
      )
    ) return;

    let run = [];

    const flush = () => {
      const text = run.map(node => node.textContent).join('')
        .replace(/\s+/g, ' ').trim();

      const alreadyMarked = run.some(node =>
        node.nodeType === Node.ELEMENT_NODE &&
        node.classList.contains('exam-print-instruction')
      );

            // Do not bold complete (A)/(B) alternatives.
      // Keep only the main question instructions bold.
      const isAlternative =
        /^\s*\([A-Z]\)(?:\s|$)/i.test(text) ||
        !!block.closest(
          '.cbse-hanging-choice, .cbse-hanging-content'
        );

      if (
        run.length &&
        !alreadyMarked &&
        !isAlternative &&
        instructionStart.test(text)
      ) {
        const instruction = document.createElement('span');
        instruction.className = 'exam-print-instruction';

        run[0].before(instruction);

        run.forEach(node => {
          instruction.appendChild(node);
        });
      }

      run = [];
    };

    Array.from(block.childNodes).forEach(node => {
      if (
        node.nodeType === Node.ELEMENT_NODE &&
        /^(BR|P|DIV|UL|OL|TABLE|PRE|BLOCKQUOTE|H[1-6]|HR)$/.test(node.nodeName)
      ) {
        flush();
      } else if (
        node.nodeType === Node.TEXT_NODE ||
        node.nodeType === Node.ELEMENT_NODE
      ) {
        run.push(node);
      }
    });

    flush();
  });
}

      `;

      document.head.appendChild(style);
    }

    function makeSubquestionRow(element, marks, removeTail) {
      if (removeTail) {
        const walker = document.createTreeWalker(
          element,
          NodeFilter.SHOW_TEXT
        );

        let current;
        let lastText = null;

        while ((current = walker.nextNode())) {
          if (current.textContent.trim()) {
            lastText = current;
          }
        }

        if (lastText) {
          lastText.textContent = lastText.textContent.replace(
            /\s*\[\d+(?:\.\d+)?\]\s*$/,
            ''
          );
        }
      }

      const row = document.createElement('div');
      row.className = 'cbse-subquestion-row';

      const text = document.createElement('div');
      text.className = 'cbse-subquestion-text';

           while (element.firstChild) {
        text.appendChild(element.firstChild);
      }

      // Separate the subquestion label from its text.
      // Wrapped lines align under the text, not the number.
      const first = text.firstElementChild;
      const oldLabel = first?.textContent.trim() || '';

      if (/^(?:\(\d+\)|\([a-z]\)|(?:i|ii|iii|iv|v|vi|vii|viii|ix|x)\.)$/i.test(oldLabel)) {
        const label = document.createElement('span');
        label.className = 'cbse-subquestion-label';

        const match = oldLabel.match(/^\((\d+)\)$/);

        const isReading = /reading|passage|extract/i.test(
          `${section?.label || ''} ${q?.text?.slice(0, 100) || ''}`
        );

        const roman = [
          'i', 'ii', 'iii', 'iv', 'v',
          'vi', 'vii', 'viii', 'ix', 'x',
          'xi', 'xii'
        ];

        const index = match ? Number(match[1]) - 1 : -1;

        label.textContent = index >= 0
          ? (
              isReading
                ? `${roman[index] || index + 1}.`
                : `(${String.fromCharCode(97 + index)})`
            )
          : oldLabel;

        first.remove();

        const content = document.createElement('div');
        content.className = 'cbse-subquestion-content';

        while (text.firstChild) {
          content.appendChild(text.firstChild);
        }

                content.querySelectorAll('b,strong').forEach(el => {
          if (!el.textContent.trim()) {
            el.remove();
          }
        });

        content.innerHTML = content.innerHTML
          .replace(/(?:<br\s*\/?>\s*){2,}/gi, '<br>')
          .replace(/^(?:\s|<br\s*\/?>)+|(?:\s|<br\s*\/?>)+$/gi, '');
        text.append(label, content);
      }

      const mark = document.createElement('span');
      mark.className = 'cbse-subquestion-marks';
      mark.textContent = `[${marks}]`;

      row.append(text, mark);
      element.replaceWith(row);
    }

    // Convert detached marks into identifiable blocks.
    Array.from(stem.childNodes).forEach(node => {
      const text = node.textContent.trim();

      if (!text) {
        if (node.nodeType === Node.TEXT_NODE) node.remove();
        return;
      }

      if (
        /^\[\d+(?:\.\d+)?\]$/.test(text) &&
        (
          node.nodeType === Node.TEXT_NODE ||
          /^(B|STRONG|SPAN)$/.test(node.nodeName)
        )
      ) {
        const paragraph = document.createElement('p');
        node.replaceWith(paragraph);
        paragraph.appendChild(node);
      }
    });

    // A detached [2] following A / OR / B belongs to both alternatives.
    Array.from(stem.children).forEach(element => {
      const match = element.textContent.trim().match(
        /^\[(\d+(?:\.\d+)?)\]$/
      );

      if (!match) return;

      const alternatives = [];
      let previous = element.previousElementSibling;
      let foundOR = false;

      while (previous) {
        const text = previous.textContent.trim();

        if (!text && !previous.querySelector('img, table')) {
          previous = previous.previousElementSibling;
          continue;
        }

        if (/^OR$/i.test(text)) {
          foundOR = true;
          previous = previous.previousElementSibling;
          continue;
        }

        if (
          /^(?:\(\d+\)\s*)?\([A-Z]\)\s+\S/.test(text) &&
          !previous.classList.contains('cbse-subquestion-row')
        ) {
          alternatives.push(previous);
          previous = previous.previousElementSibling;
          continue;
        }

        break;
      }

      if (foundOR && alternatives.length >= 2) {
        alternatives.forEach(alternative => {
          makeSubquestionRow(alternative, match[1], false);
        });

        element.remove();
      }
    });

        // Move ordinary subquestion marks, such as [1], into the right column.
    stem.querySelectorAll('img').forEach(img => {
      img.classList.add('question-img');
    });

    Array.from(stem.querySelectorAll('p, div')).reverse().forEach(element => {
      if (
        element.closest('.cbse-subquestion-row') ||
        element.querySelector('.cbse-subquestion-row')
      ) return;

      const text = element.textContent.trim();

            if (!/^(?:\(\d+\)|\([a-z]\)|(?:i|ii|iii|iv|v|vi|vii|viii|ix|x)\.)\s*\S/i.test(text)) return;

      const match = text.match(/\[(\d+(?:\.\d+)?)\]\s*$/);

      if (match) {
        makeSubquestionRow(element, match[1], true);
      }
    });

        // Add an instruction to reading passages when missing.
        const readingSection = /reading|passage|extract/i.test(
      `${section?.label || ''} ${q?.text?.slice(0, 100) || ''}`
    );

    if (
      readingSection &&
      !/poetry|poem|verse/i.test(String(section?.label || ''))
    ) {
      stem.classList.add('cbse-prose-passage');
    }

    const firstSubquestion =
      stem.querySelector('.cbse-subquestion-row');

    if (
      readingSection &&
      firstSubquestion &&
      !/answer.{0,50}(?:questions|items)/i.test(stem.textContent)
    ) {
      const prompt = document.createElement('p');

      prompt.innerHTML =
        '<b>Answer the following questions:</b>';

      firstSubquestion.before(prompt);
    }

    
    
    // Fix (A)/(B) extracts that also contain numbered subquestions.
    Array.from(stem.querySelectorAll('div')).reverse().forEach(group => {
      if (group.closest('.cbse-subquestion-row, .cbse-hanging-choice, .options-block')) return;
      if (!group.querySelector('.cbse-subquestion-row')) return;

      const first = Array.from(group.childNodes).find(node =>
        node.nodeType === Node.TEXT_NODE
          ? !!node.textContent.trim()
          : node.nodeType === Node.ELEMENT_NODE && !!node.textContent.trim()
      );

      if (!first || (first.nodeType === Node.ELEMENT_NODE &&
          first.querySelector('.cbse-subquestion-row'))) return;

      const leadingText = first.nodeType === Node.TEXT_NODE
        ? first
        : (() => {
            const walker = document.createTreeWalker(first, NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
              if (node.textContent.trim()) return node;
            }
            return null;
          })();

      const match = leadingText?.textContent.match(/^\s*(\([AB]\))(?=\s|["“']|$)\s*/i);
      if (!match) return;

      const row = document.createElement('div');
      row.className = 'cbse-hanging-choice';

      const label = document.createElement('span');
      label.className = 'cbse-hanging-label';
      label.textContent = match[1];

      const content = document.createElement('div');
      content.className = 'cbse-hanging-content';

      row.append(label, content);
      first.before(row);

      leadingText.textContent =
        leadingText.textContent.slice(match[0].length);

      if (!first.textContent.trim() &&
          first.nodeType === Node.ELEMENT_NODE &&
          !first.querySelector('img, table, svg')) {
        first.remove();
      }

      let next = row.nextSibling;

      while (next) {
        const following = next.nextSibling;

        if (next.nodeType === Node.ELEMENT_NODE && (
          next.matches('.cbse-subquestion-row, .cbse-centred-or, .options-block') ||
          next.querySelector('.cbse-subquestion-row')
        )) break;

        if (/^(?:OR|\([AB]\))$/i.test((next.textContent || '').trim())) break;

        content.appendChild(next);
        next = following;
      }
    });

    // Give alternatives and unmarked subquestions a hanging label.

    Array.from(stem.querySelectorAll('p, div')).reverse().forEach(block => {
      if (block.closest(
        '.cbse-subquestion-row, .cbse-hanging-choice, .options-block, td, th'
      )) return;

      if (block.querySelector(
        '.cbse-subquestion-row, .cbse-hanging-choice'
      )) return;

      const firstNode = Array.from(block.childNodes).find(node =>
        node.nodeType === Node.TEXT_NODE
          ? !!node.textContent.trim()
          : node.nodeType === Node.ELEMENT_NODE &&
            node.tagName !== 'BR' &&
            !!node.textContent.trim()
      );

      if (!firstNode) return;

      const labelPattern =
        /^\s*(\((?:[A-Za-z]|\d{1,2})\)|(?:i|ii|iii|iv|v|vi|vii|viii|ix|x)\.)\s*/i;

      const match = firstNode.textContent.match(labelPattern);
      if (!match) return;

      const labelText = match[1];

      if (firstNode.nodeType === Node.TEXT_NODE) {
        firstNode.textContent =
          firstNode.textContent.slice(match[0].length);
      } else if (firstNode.textContent.trim() === labelText) {
        firstNode.remove();
      } else {
        const walker = document.createTreeWalker(
          firstNode,
          NodeFilter.SHOW_TEXT
        );

        let textNode;

        while ((textNode = walker.nextNode())) {
          if (!textNode.textContent.trim()) continue;

          textNode.textContent =
            textNode.textContent.replace(labelPattern, '');

          break;
        }
      }

      const label = document.createElement('span');
      label.className = 'cbse-hanging-label';
      label.textContent = labelText;

      const content = document.createElement('div');
      content.className = 'cbse-hanging-content';

      while (block.firstChild) {
        content.appendChild(block.firstChild);
      }

      block.classList.add('cbse-hanging-choice');
      block.append(label, content);
    });

    
    // Keep all poetry lines aligned after (A) or (B).
    // Poetry extracts may store each line separately.
    const isPoetryExtract =
      /\b(?:poetry|poem|poetic|verse|stanza)\b/i.test(
        `${section?.label || ''} ${q?.text || q?.question || ''}`
      );

    if (isPoetryExtract) {
      stem.querySelectorAll('.cbse-hanging-choice').forEach(choice => {
        const label = choice.querySelector(
          ':scope > .cbse-hanging-label'
        );

        const content = choice.querySelector(
          ':scope > .cbse-hanging-content'
        );

        if (
          !label ||
          !content ||
          !/^\([A-Z]\)$/.test(label.textContent.trim())
        ) return;

        let following = choice.nextSibling;

        while (following) {
          const next = following.nextSibling;
          const isElement =
            following.nodeType === Node.ELEMENT_NODE;
          const text = following.textContent.trim();

          if (!text && !isElement) {
            following.remove();
            following = next;
            continue;
          }

          if (isElement && following.tagName === 'BR') {
            following.remove();
            following = next;
            continue;
          }

          // Stop at OR, the next alternative, or a subquestion.
          if (
            /^(?:OR\b|\([A-Za-z]\)|\(\d+\)|[ivxlcdm]+\.)\s*/i.test(text) ||
            (isElement && (
              following.matches(
                '.cbse-hanging-choice, .cbse-subquestion-row, .cbse-centred-or, .exam-print-instruction, .options-block'
              ) ||
              following.querySelector(
                '.cbse-hanging-choice, .cbse-subquestion-row, .options-block'
              )
            ))
          ) break;

          if (
            isElement &&
            !/^(P|DIV|SPAN)$/.test(following.tagName)
          ) break;

          if (!text) {
            following.remove();
          } else if (
            isElement &&
            following.tagName !== 'SPAN'
          ) {
            content.appendChild(following);
          } else {
            const verseLine = document.createElement('div');
            verseLine.appendChild(following);
            content.appendChild(verseLine);
          }

          following = next;
        }
      });
    }

    // Centre standalone OR after the HTML cleanup.
    stem.querySelectorAll('p, div').forEach(element => {


      if (
        element.textContent.trim().toUpperCase() === 'OR' &&
        !element.querySelector('p, div, table, img')
      ) {
        element.classList.add('cbse-centred-or');
      }
    });

    const line = stem.parentElement;
    line.classList.add('cbse-question-line');

    // Use a span so the existing bold-tag cleanup preserves this class.
    let marks = Array.from(line.children).find(
      child => child !== stem && /^(B|STRONG)$/.test(child.tagName)
    );

    const markSpan = document.createElement('span');
    markSpan.className = 'cbse-question-marks';
    markSpan.textContent = `[${q.marks}]`;

    if (marks) {
      marks.replaceWith(markSpan);
    } else {
      line.appendChild(markSpan);
    }
  }

  return holder.innerHTML;
}

function cbsePrintSectionName(subject, section, combined = false) {
  const label = String(section.label || section.name || '');
  const match = label.match(/^\s*(Section\s+[A-Z0-9]+)/i);
  const name = match ? match[1] : label;

  if (!/^english\b/i.test(String(subject.subject || ''))) return name;
  if (/^Section\s+A$/i.test(name)) return 'Section A — Reading Skills';
  if (/^Section\s+C$/i.test(name)) return 'Section C — Literature Textbook';

  if (/^Section\s+B$/i.test(name)) {
    if (combined) return 'Section B — Grammar and Writing';
    const type = String(section.mcqType || '');
    const task = label.split(/[—–]/).pop() || label;
    if (/grammar/i.test(type + ' ' + task)) {
      return 'Section B — Grammar';
    }
    if (/writing|letter|analytical/i.test(type + ' ' + task)) {
      return 'Section B — Writing';
    }
    return /writing/i.test(label) && !/grammar/i.test(label)
      ? 'Section B — Writing' : 'Section B — Grammar';
  }

  return name;
}

function cbseFormatSectionBoxes(page) {
  if (!cbsePrintEnabled()) return;

  if (!document.getElementById('cbse-board-layout-style')) {
    const style = document.createElement('style');
    style.id = 'cbse-board-layout-style';

    style.textContent = `

      }
